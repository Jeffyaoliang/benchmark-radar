name: Send email brief

# Issue #977. Once a day, after the 05:00 UTC radar run has recorded the day's
# snapshot and Deploy Dashboard has published its brief, send that brief to
# the Kit subscribers. Setup and recovery: docs/kit-email.md.

on:
  schedule:
    # Three hours after the radar cron, which leaves room for a late scheduled
    # start and the deploy. A brief that is still not live fails the run.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Brief date (YYYY-MM-DD). Empty means today in UTC.
        required: false
        type: string
      mode:
        description: preview renders only; draft saves to Kit; send schedules it
        required: true
        type: choice
        options: [preview, draft, send]
        default: preview

# One send at a time, and a queued run never replaces a running one.
concurrency:
  group: send-email
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    # Live sends only from the default branch's own code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Pushing the email/<date> tag is the record that a day was sent.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .

      - name: Choose the date and mode
        id: plan
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_MODE: ${{ inputs.mode }}
          # A scheduled run sends unless the KIT_EMAIL_MODE variable says
          # otherwise; set it to "off" to stop every scheduled send.
          SCHEDULED_MODE: ${{ vars.KIT_EMAIL_MODE || 'send' }}
        run: |
          set -euo pipefail
          day="${INPUT_DATE:-$(date -u +%F)}"
          if ! [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::date must be YYYY-MM-DD, got: $day"
            exit 1
          fi
          mode="${INPUT_MODE:-$SCHEDULED_MODE}"
          case "$mode" in off|preview|draft|send) ;; *)
            echo "::error::unknown mode: $mode"; exit 1 ;;
          esac
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Brief $day, mode $mode"

      - name: Require the brief to be live on the site
        if: steps.plan.outputs.mode != 'off'
        env:
          DAY: ${{ steps.plan.outputs.day }}
        run: |
          set -euo pipefail
          url="https://benchmark-radar.org/blog/${DAY}/"
          for wait in 0 30 60 120 240; do
            sleep "$wait"
            if curl -fsS --max-time 30 "$url" | grep -qF "<link rel=\"canonical\" href=\"${url}\">"; then
              echo "Live: $url"
              exit 0
            fi
          done
          echo "::error title=Brief not live::$url is not published, so nothing was sent"
          exit 1

      - name: Skip a day that was already sent
        if: steps.plan.outputs.mode == 'send'
        id: ledger
        env:
          DAY: ${{ steps.plan.outputs.day }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/email/${DAY}" >/dev/null; then
            echo "email/${DAY} exists: this day was sent or its send is unresolved. Skipping."
            echo "sent=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The tag goes up before Kit is called. If the call then fails or its
          # answer is lost, the day stays blocked until someone checks Kit and
          # deletes the tag, so one day can be missed but never mailed twice.
          git tag "email/${DAY}"
          git push origin "refs/tags/email/${DAY}"
          echo "sent=false" >> "$GITHUB_OUTPUT"

      - name: Render, and send or save to Kit
        if: steps.plan.outputs.mode != 'off' && steps.ledger.outputs.sent != 'true'
        env:
          DAY: ${{ steps.plan.outputs.day }}
          MODE: ${{ steps.plan.outputs.mode }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_DAILY_SEGMENT_ID: ${{ vars.KIT_DAILY_SEGMENT_ID }}
          KIT_WEEKLY_SEGMENT_ID: ${{ vars.KIT_WEEKLY_SEGMENT_ID }}
        run: python -m benchmark_radar.email_brief --date "$DAY" --mode "$MODE" --out email.html

      - name: Keep the rendered email
        if: always() && steps.plan.outputs.mode != 'off'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: email-${{ steps.plan.outputs.day }}
          path: email.html
          if-no-files-found: ignore
